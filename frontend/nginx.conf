map $http_x_forwarded_proto $finpath_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $finpath_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve the existing /api/v1 paths while sending them to the private
    # backend. Do not add a trailing slash to BACKEND_UPSTREAM.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $finpath_forwarded_host;
        proxy_set_header X-Forwarded-Proto $finpath_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass ${BACKEND_UPSTREAM}/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $finpath_forwarded_host;
        proxy_set_header X-Forwarded-Proto $finpath_forwarded_proto;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
