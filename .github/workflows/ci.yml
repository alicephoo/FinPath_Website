name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only repository access is sufficient: this workflow only builds, tests,
# and uploads artifacts. It never pushes, deploys, or creates cloud resources.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

  # Temporary PostgreSQL URLs for an isolated service container on the runner.
  # The container uses trust authentication and exists only for this job, so no
  # repository secrets or production credentials are involved.
  FINPATH_TEST_DATABASE_URL: postgresql+psycopg://finpath_app@127.0.0.1:5432/finpath_test
  FINPATH_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://finpath_migrator@127.0.0.1:5432/finpath_test
  FINPATH_TEST_REGISTRATION_DATABASE_URL: postgresql+psycopg://finpath_registration@127.0.0.1:5432/finpath_test

  # Development URLs point at a database that is never created in CI. Tests use
  # only the FINPATH_TEST_* URLs above; keeping these distinct also satisfies
  # the test safety check that rejects a test target matching the development
  # database name.
  FINPATH_DATABASE_URL: postgresql+psycopg://finpath_app@127.0.0.1:5432/finpath
  FINPATH_MIGRATION_DATABASE_URL: postgresql+psycopg://finpath_migrator@127.0.0.1:5432/finpath
  FINPATH_REGISTRATION_DATABASE_URL: postgresql+psycopg://finpath_registration@127.0.0.1:5432/finpath

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: finpath_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finpath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Create temporary CI database roles
        run: |
          # Wait for the service container's final TCP listener. PostgreSQL's
          # initialization phase briefly exposes only a Unix socket.
          for attempt in $(seq 1 30); do
            if psql -h 127.0.0.1 -U postgres -d finpath_test -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          psql -h 127.0.0.1 -U postgres -d finpath_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE finpath_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finpath_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finpath_registration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;

          ALTER DATABASE finpath_test OWNER TO finpath_migrator;
          ALTER SCHEMA public OWNER TO finpath_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO finpath_migrator;
          GRANT CONNECT ON DATABASE finpath_test TO finpath_app, finpath_registration;
          SQL

      - name: Apply migrations and seed reference data
        working-directory: backend
        env:
          FINPATH_MIGRATION_DATABASE_URL: ${{ env.FINPATH_TEST_MIGRATION_DATABASE_URL }}
        run: |
          alembic upgrade head
          python -m app.db.seed

      - name: Run backend tests
        working-directory: backend
        run: |
          mkdir -p test-results
          python -m pytest -q --junitxml=test-results/backend.xml

      - name: Upload backend test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm run test:run

      - name: Type check
        run: npx tsc -b

      - name: Production build
        run: npx vite build

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: finpath_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finpath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create backend virtual environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create temporary CI database roles
        run: |
          # Wait for the service container's final TCP listener. PostgreSQL's
          # initialization phase briefly exposes only a Unix socket.
          for attempt in $(seq 1 30); do
            if psql -h 127.0.0.1 -U postgres -d finpath_test -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          psql -h 127.0.0.1 -U postgres -d finpath_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE finpath_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finpath_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE finpath_registration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;

          ALTER DATABASE finpath_test OWNER TO finpath_migrator;
          ALTER SCHEMA public OWNER TO finpath_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO finpath_migrator;
          GRANT CONNECT ON DATABASE finpath_test TO finpath_app, finpath_registration;
          SQL

      - name: Apply migrations and seed reference data
        working-directory: backend
        env:
          FINPATH_MIGRATION_DATABASE_URL: ${{ env.FINPATH_TEST_MIGRATION_DATABASE_URL }}
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m app.db.seed

      - name: Create temporary backend environment file
        working-directory: backend
        run: |
          umask 077
          {
            printf 'FINPATH_TEST_DATABASE_URL=%s\n' "$FINPATH_TEST_DATABASE_URL"
            printf 'FINPATH_TEST_MIGRATION_DATABASE_URL=%s\n' "$FINPATH_TEST_MIGRATION_DATABASE_URL"
            printf 'FINPATH_TEST_REGISTRATION_DATABASE_URL=%s\n' "$FINPATH_TEST_REGISTRATION_DATABASE_URL"
            printf 'FINPATH_ACCESS_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'FINPATH_REQUIRE_EMAIL_VERIFICATION=false\n'
          } > .env

      - name: Run browser E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
